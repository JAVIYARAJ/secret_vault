name: secret_vault
description: A local project-based secrets manager.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  encrypt: ^5.0.3
  uuid: ^4.3.3
  file_picker: ^6.1.1
  path_provider: ^2.1.2
  window_manager: ^0.4.3
  crypto: ^3.0.3
  path: ^1.9.1
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
